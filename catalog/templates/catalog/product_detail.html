{% extends "catalog/base.html" %}

{% block title %}Контакты{% endblock %}

{% block content %}

<div class="container">
    <h1>Product Information</h1>

    <div class="product">
        <div class="product-card mb-4">
            <img src="{{ product.image.url }}" alt="#">
            <h2>{{ product.name }}</h2>
            <p>{{ product.description }}</p>
            <p class="price">Price: ${{ product.price }}</p>
        </div>
    </div>
{% endblock %}
