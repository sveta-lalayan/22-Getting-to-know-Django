<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
</head>
<body>
    <h2>Регистрация</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть учетная запись? <a href="{% url 'login' %}">Войдите</a></p>
    <p><a href="{% url 'catalog:home' %}">На главную</a></p> <!-- Ссылка на главную страницу -->
</body>
</html>
